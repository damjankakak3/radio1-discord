[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radio1-discord-bot"
version = "2.0.0"
description = "Follow Rádió 1 on your own Spotify device from Discord."
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.6,<3",
  "aiohttp>=3.12,<4",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "cryptography>=45",
  "python-dotenv>=1.1,<2",
  "beautifulsoup4>=4.13,<5",
  "tzdata>=2025.2",
]

[project.scripts]
radio1 = "radio1_bot.__main__:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "pytest-aiohttp>=1.1", "ruff>=0.13", "mypy>=1.18", "types-beautifulsoup4>=4.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/radio1_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
