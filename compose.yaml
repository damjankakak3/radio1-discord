services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/radio1.db
      WEB_HOST: 0.0.0.0
      WEB_PORT: 5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - radio1-data:/app/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
volumes:
  radio1-data:
